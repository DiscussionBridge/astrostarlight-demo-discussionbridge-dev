<svg xmlns="http://www.w3.org/2000/svg" width="960" height="320" viewBox="0 0 960 320" role="img" aria-labelledby="title desc">
  <title id="title">DiscussionBridge content flow</title>
  <desc id="desc">A publishing platform connects through DiscussionBridge to a Discourse-powered discussion.</desc>
  <defs>
    <linearGradient id="background" x1="0" x2="1">
      <stop offset="0" stop-color="#10213b"/>
      <stop offset="1" stop-color="#243c67"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#86d7ff"/>
    </marker>
  </defs>
  <rect width="960" height="320" rx="28" fill="url(#background)"/>
  <g fill="#fff" font-family="system-ui, sans-serif" text-anchor="middle">
    <rect x="60" y="92" width="240" height="136" rx="18" fill="#274f78" stroke="#86d7ff" stroke-width="3"/>
    <text x="180" y="150" font-size="28" font-weight="700">Publishing platform</text>
    <text x="180" y="187" font-size="20" fill="#d7efff">Astro or Ghost</text>
    <rect x="360" y="72" width="240" height="176" rx="24" fill="#6957c8" stroke="#d6ccff" stroke-width="3"/>
    <text x="480" y="143" font-size="30" font-weight="800">DiscussionBridge</text>
    <text x="480" y="184" font-size="20" fill="#eeeaff">Stable content identity</text>
    <rect x="660" y="92" width="240" height="136" rx="18" fill="#2f6957" stroke="#8ff0c8" stroke-width="3"/>
    <text x="780" y="150" font-size="28" font-weight="700">The Bridge</text>
    <text x="780" y="187" font-size="20" fill="#d9fff0">Discourse discussion</text>
  </g>
  <g fill="none" stroke="#86d7ff" stroke-width="6" marker-end="url(#arrow)">
    <path d="M305 140H350"/>
    <path d="M605 140H650"/>
  </g>
  <g fill="none" stroke="#8ff0c8" stroke-width="5" marker-end="url(#arrow)">
    <path d="M655 192H610"/>
    <path d="M355 192H310"/>
  </g>
</svg>
